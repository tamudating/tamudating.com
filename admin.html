<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel | TamuDating</title>
    <meta name="description" content="Admin tools to review member payments and approval status." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <div class="container admin-wrapper">
      <header class="admin-header">
        <div class="brand">
          <span class="brand-mark">♥</span>
          <span>TamuDating Admin</span>
        </div>

        <div class="profile-chip admin-chip">
          <span class="status-dot admin-dot"></span>
          <span>Admin: tamudating1@gmail.com</span>
        </div>
      </header>

      <main class="admin-panel">
        <section class="panel-section">
          <div class="section-heading-row">
            <h2>Pending payment approvals</h2>
          </div>

          <div id="admin-payments" class="admin-table"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
