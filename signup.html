<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | Tamu Dating</title>
    <meta name="description" content="Create your Tamu Dating account and upload a profile photo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body class="auth-page">
    <div class="auth-shell signup-shell"><div class="auth-panel form-panel wide-panel">
      <a class="brand signup-brand" href="https://tamudating.github.io/tamudating.com/"><span class="brand-mark">♥</span><span>Tamu Dating</span></a>
      <div class="auth-head"><span class="eyebrow">Join Tamu Dating · Adults 18+</span><h2>Create your account</h2></div>
      <form id="signup-form" class="auth-form grid-form">
        <label>Full name<input type="text" name="fullName" autocomplete="name" required /></label>
        <label>Email<input type="email" name="email" autocomplete="email" required /></label>
        <label>Age<input type="number" name="age" min="18" max="100" required /></label>
        <label>Town / approximate location<input type="text" name="location" required /></label>
        <label>Looking for<select name="seeking" required><option value="">Select</option><option value="older-women">Older women</option><option value="younger-men">Younger men</option><option value="both">Both</option></select></label>
        <label>Password (at least 8 characters)<input type="password" name="password" minlength="8" autocomplete="new-password" required /></label>
        <label class="full-width">Short bio<textarea name="bio" rows="4" required></textarea></label>
        <label class="full-width">Hobbies<input type="text" name="hobbies" required /></label>
        <label class="full-width">Love language<input type="text" name="loveLanguage" required /></label>
        <label class="full-width">Relationship goals<input type="text" name="goals" required /></label>
        <label class="full-width photo-upload-label">Required profile picture<input type="file" name="profilePhoto" accept="image/jpeg,image/png,image/webp" required aria-describedby="photo-help" /><span id="photo-help" class="upload-help">Choose a JPG, PNG, or WebP image up to 5 MB.</span></label>
        <p class="form-note full-width">You must be 18 or older. We will email you a verification link. Do not include your email, exact address, financial details, or M-Pesa PIN in your public profile.</p>
        <button class="primary-btn full" type="submit">Create account</button>
        <p class="auth-helper full-width">Already a member? <a href="https://tamudating.github.io/tamudating.com/login.html">Login here</a></p>
      </form>
    </div></div>
    <script type="module" src="app.js?v=5"></script>
    <script type="module" src="signup-upload.js?v=5"></script>
  </body>
</html>
